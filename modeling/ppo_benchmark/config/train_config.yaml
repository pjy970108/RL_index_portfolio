# config/train_config.yaml

# 📁 데이터 경로 설정
data_paths:
  index_before_csv : "data/index_lookback.csv"
  index_train_csv: "data/index_train.csv"
  future_before_csv: "data/future_lookback.csv"
  future_train_csv: "data/future_train.csv"
  train_pt: "data/portfolio_price/concat_portfolio_train_monthly_v1.pt"
  valid_pt : "data/portfolio_price/concat_portfolio_valid_monthly_v1.pt"

device: "cuda:0"  # 예: "cpu", "cuda:0", "cuda:1"



# 일반 환경 설정
env_name: "Portfolio Allocation"
trajectory_length: "3m"  # 선택: "1y", "6m", "3m"
window_size: 20
reward_cond: "sharpe"

# 리밸런싱 및 trajectory 세팅
update_interval_map:
  "1y": 252
  "6m": 120
  "3m": 60
  "1m": 20




# num_trajectories_map:
#   "1y": 5
#   "6m": 10
#   "3m": 20

num_trajectories : 64

batch_samples:
  "1y": 15
  "6m": 15
  "3m": 1024
  "1m": 256
  "5d" : 256


num_workers : 16
mini_batch_size: 256
temperatures  : 1.0

# 학습 관련 설정
# batch_samples : 2
mu: 3
clip_grad: 1
beta: 0.0
epsilon: 0.1
alpha_param: 1.0
epochs : 2000

# PPO 하이퍼파라미터
gamma: 0.999
lr_actor: 1e-6
lr_critic: 1e-5
eps_clip: 0.2
has_continuous_action_space: False
action_std_init: 0.6
entropy_weight: 0.01
patience: 10


# Backtesting 수치 조정
top_n: 5
look_back: 252
cost: 0.003
top_pct : 0.5


# eval_metrics
risk_free_rate: 0.0
annual_factor : 252
risk_coefficient : 20
top_pct : 0.5
top_k : 5
